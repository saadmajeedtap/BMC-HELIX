name: build-docs-pdf
# Build one complete, self-linked PDF of a BMC Helix documentation space.
# Edit .build-config.json and push to reconfigure; reports + artifacts land on the
# `docs-build` branch, and optionally a GitHub Release holds the full PDF.
on:
  workflow_dispatch:
  push:
    paths:
      - .build-config.json

concurrency:
  group: docs-pdf-build
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: read config
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, shlex
          c = json.load(open(".build-config.json"))
          for k, v in c.items():
              if isinstance(v, bool):
                  v = "1" if v else ""
              print(f"ENV_{k.upper()}={v}")
          PY
          cat .build-config.json
      - name: build
        run: bash scripts/ci_build.sh
        env:
          SPACE_PATH: ${{ env.ENV_SPACE_PATH }}
          PRODUCT: ${{ env.ENV_PRODUCT }}
          VERSION: ${{ env.ENV_VERSION }}
          PHASES: ${{ env.ENV_PHASES }}
          ONLY_SECTIONS: ${{ env.ENV_ONLY_SECTIONS }}
          MAX_DOCS: ${{ env.ENV_MAX_DOCS }}
          ENGINE: ${{ env.ENV_ENGINE }}
          WORKERS: ${{ env.ENV_WORKERS }}
          HTTP_WORKERS: ${{ env.ENV_HTTP_WORKERS }}
          DELAY: ${{ env.ENV_DELAY }}
          NO_ATTACH: ${{ env.ENV_NO_ATTACHMENTS }}
          NO_STAMP: ${{ env.ENV_NO_STAMP }}
          COMMIT_PDF: ${{ env.ENV_COMMIT_PDF }}
          PUBLISH_RELEASE: ${{ env.ENV_PUBLISH_RELEASE }}
          GH_TOKEN: ${{ github.token }}
      - name: comment
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import os, subprocess
          try:
              body = open('/tmp/helix-build/report.md').read()[-55000:]
          except Exception:
              body = "build produced no report"
          body = ("### build-docs-pdf run #" + os.environ.get("GITHUB_RUN_NUMBER", "?") +
                  " (" + os.environ.get("SPACE_PATH", "") + ", sections=" +
                  (os.environ.get("ONLY_SECTIONS") or "ALL") + ")\n\n" + body)
          subprocess.run(["gh", "api", "--method", "POST",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/1/comments",
                          "-f", f"body={body}"], check=False)
          PY
